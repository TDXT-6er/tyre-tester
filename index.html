<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tyre barcode tester</title>
<style>
:root{
  box-sizing:border-box;
  --bg:#f3f4f2;--surface:#ffffff;--ink:#16191c;--muted:#5b636a;--line:#d5d9dc;--accent:#0a6b4f;--accent-ink:#ffffff;--warn:#a85a00;--bad:#b3261e;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#121517;--surface:#1b1f22;--ink:#eceff1;--muted:#9aa3a9;--line:#2d3438;--accent:#3ecf9e;--accent-ink:#06261b;--warn:#f0a850;--bad:#ff8a80;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#121517;--surface:#1b1f22;--ink:#eceff1;--muted:#9aa3a9;--line:#2d3438;--accent:#3ecf9e;--accent-ink:#06261b;--warn:#f0a850;--bad:#ff8a80;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;line-height:1.45;font-size:16px}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:1.35rem;margin:4px 0 2px}
p.sub{margin:0 0 14px;color:var(--muted);font-size:.95rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap}
button,label.btn{font:inherit;font-weight:600;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 14px;cursor:pointer;min-height:44px;display:inline-flex;align-items:center}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:focus-visible,label.btn:focus-within{outline:3px solid var(--accent);outline-offset:2px}
#reader{width:100%;margin-top:12px;border-radius:8px;overflow:hidden;background:#000;min-height:0}
#reader video{width:100%!important}
#status{color:var(--muted);font-size:.9rem;margin-top:8px}
#status.err{color:var(--bad)}
.big{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.25rem;word-break:break-all;margin:6px 0 10px;padding:10px;background:var(--bg);border-radius:8px;border:1px solid var(--line)}
dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;margin:0}
dt{color:var(--muted)}
dd{margin:0;word-break:break-word}
.hit{color:var(--accent);font-weight:700}
.warn{color:var(--warn);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
td.code{font-family:ui-monospace,Menlo,Consolas,monospace;word-break:break-all}
.wrap{overflow-x:auto}
h2{font-size:1.05rem;margin:0 0 8px}
.empty{color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1>Tyre barcode tester</h1>
  <p class="sub">Scan each sticker to see exactly what the barcode contains and whether any code repeats.</p>

  <section class="card">
    <div class="row">
      <button class="primary" id="startBtn">Start camera</button>
      <button id="stopBtn" disabled>Stop camera</button>
      <label class="btn">Scan a photo<input id="file" type="file" accept="image/*" capture="environment" hidden></label>
    </div>
    <div id="reader"></div>
    <div id="status">Camera is off. If it won’t start here, use “Scan a photo” instead.</div>
  </section>

  <section class="card" id="result">
    <h2>Latest scan</h2>
    <div class="empty">Nothing scanned yet.</div>
  </section>

  <section class="card">
    <h2>All scans</h2>
    <div class="wrap" id="logWrap"><div class="empty">The list will build up as you scan.</div></div>
    <div class="row" style="margin-top:10px">
      <button id="copyBtn">Copy results</button>
      <button id="clearBtn">Clear list</button>
    </div>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script>
(function(){
  var scanner=null, running=false, lastText="", lastTime=0;
  var log=[];
  try{var saved=localStorage.getItem("tyreScanLog");if(saved)log=JSON.parse(saved)||[];}catch(e){}

  var $=function(id){return document.getElementById(id)};
  var statusEl=$("status");

  function setStatus(msg,isErr){statusEl.textContent=msg;statusEl.className=isErr?"err":""}
  function save(){try{localStorage.setItem("tyreScanLog",JSON.stringify(log));}catch(e){}}

  function analyse(text){
    var notes=[];
    var digits=/^\d+$/.test(text);
    var type="Text or mixed";
    if(digits){
      if(text.length===13)type="Digits only, 13 long (looks like EAN-13)";
      else if(text.length===12)type="Digits only, 12 long (looks like UPC-A)";
      else if(text.length===8)type="Digits only, 8 long (looks like EAN-8)";
      else if(text.length===14)type="Digits only, 14 long (looks like GTIN-14)";
      else type="Digits only, "+text.length+" long";
    } else if(/^[A-Za-z0-9\-\.\/ ]+$/.test(text)){
      type="Letters and numbers, "+text.length+" long";
    } else {
      type="Contains special characters, "+text.length+" long";
    }
    var m=text.match(/(\d{3})\s*\/\s*(\d{2})\s*\/?\s*(?:Z?R|ZR)?\s*(\d{2})\b/i);
    var size=m?(m[1]+"/"+m[2]+" R"+m[3]):null;
    if(text.indexOf("\u001d")>-1||/^\(\d{2,4}\)/.test(text))notes.push("Looks like GS1 structured data");
    return {type:type,size:size,notes:notes};
  }

  function countOf(text){return log.filter(function(e){return e.text===text}).length}

  function handle(text,format){
    var now=Date.now();
    if(text===lastText&&now-lastTime<1500)return;
    lastText=text;lastTime=now;
    log.push({text:text,format:format||"unknown",time:new Date().toLocaleTimeString()});
    save();
    if(navigator.vibrate)try{navigator.vibrate(60)}catch(e){}
    render(text,format);
  }

  function render(text,format){
    var a=analyse(text), n=countOf(text);
    var box=$("result");
    box.innerHTML="";
    var h=document.createElement("h2");h.textContent="Latest scan";box.appendChild(h);
    var big=document.createElement("div");big.className="big";big.textContent=text;box.appendChild(big);
    var dl=document.createElement("dl");
    function add(k,v,cls){var dt=document.createElement("dt");dt.textContent=k;var dd=document.createElement("dd");dd.textContent=v;if(cls)dd.className=cls;dl.appendChild(dt);dl.appendChild(dd)}
    add("Barcode format",format||"unknown");
    add("Content",a.type);
    add("Size in the code",a.size?a.size:"No size found. This is probably just an ID number.",a.size?"hit":"warn");
    add("Times scanned",n+(n>1?" (same code seen again)":""),n>1?"warn":null);
    a.notes.forEach(function(x){add("Note",x)});
    box.appendChild(dl);
    renderLog();
  }

  function renderLog(){
    var wrap=$("logWrap");
    if(!log.length){wrap.innerHTML='<div class="empty">The list will build up as you scan.</div>';return}
    var t=document.createElement("table");
    t.innerHTML="<thead><tr><th>#</th><th>Code</th><th>Format</th><th>Seen</th></tr></thead>";
    var tb=document.createElement("tbody");
    log.forEach(function(e,i){
      var tr=document.createElement("tr");
      var c=[String(i+1),e.text,e.format,String(countOf(e.text))];
      c.forEach(function(v,j){var td=document.createElement("td");td.textContent=v;if(j===1)td.className="code";tr.appendChild(td)});
      tb.appendChild(tr);
    });
    t.appendChild(tb);
    wrap.innerHTML="";wrap.appendChild(t);
  }

  function getScanner(){
    if(!scanner){
      var F=Html5QrcodeSupportedFormats;
      scanner=new Html5Qrcode("reader",{
        formatsToSupport:[F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E,F.CODE_128,F.CODE_39,F.CODE_93,F.ITF,F.CODABAR,F.QR_CODE,F.DATA_MATRIX,F.PDF_417,F.AZTEC],
        experimentalFeatures:{useBarCodeDetectorIfSupported:true},
        verbose:false
      });
    }
    return scanner;
  }

  $("startBtn").onclick=function(){
    if(typeof Html5Qrcode==="undefined"){setStatus("The scanner library didn’t load. Check your connection and reload.",true);return}
    var s=getScanner();
    s.start({facingMode:"environment"},{fps:10,qrbox:{width:300,height:150}},function(text,res){
      var f="unknown";try{f=res.result.format.formatName}catch(e){}
      handle(text,f);
    },function(){}).then(function(){
      running=true;$("startBtn").disabled=true;$("stopBtn").disabled=false;
      setStatus("Camera on. Hold a sticker steady inside the box.");
    }).catch(function(err){
      setStatus("Couldn’t start the camera ("+(err&&err.message?err.message:err)+"). Allow camera access, or use “Scan a photo”.",true);
    });
  };

  $("stopBtn").onclick=function(){
    if(!scanner||!running)return;
    scanner.stop().then(function(){running=false;$("startBtn").disabled=false;$("stopBtn").disabled=true;setStatus("Camera is off.")}).catch(function(){});
  };

  $("file").onchange=function(ev){
    var f=ev.target.files&&ev.target.files[0];
    if(!f)return;
    if(typeof Html5Qrcode==="undefined"){setStatus("The scanner library didn’t load. Check your connection and reload.",true);return}
    if(running){setStatus("Stop the camera first, then scan a photo.",true);ev.target.value="";return}
    setStatus("Reading photo…");
    getScanner().scanFile(f,false).then(function(text){
      lastText="";handle(text,"from photo");setStatus("Photo read.");
    }).catch(function(){
      setStatus("No barcode found in that photo. Try a closer, sharper shot with the barcode filling the frame.",true);
    });
    ev.target.value="";
  };

  $("copyBtn").onclick=function(){
    var txt=log.map(function(e,i){return (i+1)+"\t"+e.text+"\t"+e.format}).join("\n");
    if(!txt){setStatus("Nothing to copy yet.",true);return}
    var done=function(){setStatus("Results copied.")};
    try{navigator.clipboard.writeText(txt).then(done,function(){window.prompt("Copy these results:",txt)})}
    catch(e){window.prompt("Copy these results:",txt)}
  };

  $("clearBtn").onclick=function(){
    log=[];lastText="";save();renderLog();
    $("result").innerHTML='<h2>Latest scan</h2><div class="empty">Nothing scanned yet.</div>';
    setStatus(running?"List cleared. Camera still on.":"List cleared.");
  };

  renderLog();
})();
</script>
</body>
</html>
